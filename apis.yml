name: First Circle
description: First Circle is a Philippine fintech offering digital business banking and non-collateral
  financing to small and medium enterprises. Its products include free online business bank accounts,
  business credit lines up to PHP 20M, same/next-day express business loans, longer-term Business Credit
  Plus, future salary access for employees, and solar financing. The company is 100% online with
  five-minute account opening and no branch visits, serves over 5,000 Filipino businesses, and has
  disbursed roughly PHP 16 billion in loans. It is licensed by the Securities and Exchange Commission
  (SEC), with banking delivered through partner rural banks regulated by the Bangko Sentral ng Pilipinas
  (BSP). It was surfaced as a 500 Global portfolio company. No public developer API surface is currently
  published.
